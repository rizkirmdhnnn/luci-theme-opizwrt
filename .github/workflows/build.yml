name: Build package

# Tema ini tidak memuat kode arsitektur apa pun, jadi luci.mk memberinya
# PKGARCH 'all': satu berkas .apk berlaku untuk semua target OpenWrt pada
# rilis yang sama. Karena itu SDK x86/64 dipakai -- yang tercepat diunduh --
# meski hasilnya dipasang di ARM, MIPS, atau apa pun.

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  RELEASE: 25.12.5

jobs:
  build:
    runs-on: ubuntu-24.04
    # GITHUB_TOKEN di repo baru bersifat baca-saja, sehingga langkah rilis
    # ditolak dengan "Resource not accessible by integration".
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      # Dijalankan sebelum SDK diunduh supaya gagal dalam hitungan detik,
      # bukan setelah sepuluh menit.
      - name: Pastikan cascade.css hasil pemadatan sinkron dengan sumbernya
        working-directory: src
        run: |
          # htdocs/luci-static/opizwrt/cascade.css adalah berkas TURUNAN dari
          # src/cascade.css. Menyunting yang turunan akan tersapu pada
          # pembangunan berikutnya, jadi CI menolaknya di sini alih-alih
          # membiarkan perubahan itu diam-diam hilang.
          ./tools/build-css.sh
          if ! git diff --quiet -- htdocs/luci-static/opizwrt/cascade.css; then
            echo "GAGAL: cascade.css yang ter-commit tidak cocok dengan hasil"
            echo "pemadatan src/cascade.css. Jalankan ./tools/build-css.sh"
            echo "lalu commit hasilnya."
            git diff --stat -- htdocs/luci-static/opizwrt/cascade.css
            exit 1
          fi
          echo "OK: berkas turunan sinkron dengan sumber"

      - name: Pasang dependensi build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget zstd

      - name: Unduh SDK OpenWrt ${{ env.RELEASE }}
        run: |
          BASE=https://downloads.openwrt.org/releases/$RELEASE/targets/x86/64
          # Nama berkas SDK memuat versi toolchain yang berubah antar rilis,
          # jadi ia dibaca dari sha256sums alih-alih dipaku.
          SDK=$(curl -fsSL "$BASE/sha256sums" | grep -o 'openwrt-sdk-[^ ]*\.tar\.zst' | head -1)
          echo "SDK: $SDK"
          curl -fsSL -O "$BASE/$SDK"
          tar --zstd -xf "$SDK"
          mv "${SDK%.tar.zst}" sdk

      - name: Siapkan feed LuCI
        working-directory: sdk
        run: |
          # luci.mk dibutuhkan Makefile paket ini. Hanya feed luci yang
          # diperbarui; sisanya tidak relevan dan hanya memperlambat.
          ./scripts/feeds update luci
          ./scripts/feeds install luci-base
          test -f feeds/luci/luci.mk || { echo "GAGAL: luci.mk tidak ada"; exit 1; }

      - name: Pasang paket tema
        working-directory: sdk
        run: |
          cp -r ../src package/luci-theme-opizwrt
          rm -rf package/luci-theme-opizwrt/.git package/luci-theme-opizwrt/docs
          chmod +x package/luci-theme-opizwrt/root/etc/uci-defaults/30_luci-theme-opizwrt

      - name: Build
        working-directory: sdk
        run: |
          echo "CONFIG_PACKAGE_luci-theme-opizwrt=m" > .config
          make defconfig
          make package/luci-theme-opizwrt/compile -j$(nproc) V=s 2>&1 | tail -30

      - name: Periksa hasil
        working-directory: sdk
        run: |
          PKG=$(find bin -name 'luci-theme-opizwrt*.apk' -o -name 'luci-theme-opizwrt*.ipk' | head -1)
          test -n "$PKG" || { echo "GAGAL: paket tidak terbentuk"; exit 1; }
          echo "paket: $PKG ($(du -h "$PKG" | cut -f1))"

          # apk-tools 3 memakai format arsip baru yang tidak terbaca oleh tar,
          # jadi isi paket diperiksa dari direktori yang dipaketkan buildroot,
          # bukan dari berkas hasilnya. Isinya sama persis.
          ROOT=$(find build_dir -path '*/www/luci-static/opizwrt/cascade.css' | head -1)
          test -n "$ROOT" || { echo "GAGAL: direktori paket tidak ditemukan"; exit 1; }
          ROOT=${ROOT%/www/luci-static/opizwrt/cascade.css}

          echo "== isi paket =="
          (cd "$ROOT" && find . -type f | sort | sed 's|^\.|  |')

          # Satu berkas hilang berarti tema terpasang tapi tidak pernah tampil,
          # dan itu kegagalan yang sunyi kalau tidak diuji di sini.
          echo "== berkas wajib =="
          for f in cascade.css logo.svg menu-opizwrt.js \
                   header.ut footer.ut sysauth.ut 30_luci-theme-opizwrt; do
            if find "$ROOT" -name "$f" | grep -q .; then
              echo "  OK      $f"
            else
              echo "  HILANG  $f"; exit 1
            fi
          done

          # Memeriksa keberadaan berkas saja tidak cukup. csstidy pernah
          # memotong cascade.css jadi sepertiga ukurannya dan keluar dengan
          # kode 0, sehingga paket terkirim dengan sepertiga aturan hilang
          # tanpa satu pun tanda. Isinya harus ikut diperiksa.
          echo "== keutuhan isi =="
          CSS="$ROOT/www/luci-static/opizwrt/cascade.css"
          JS="$ROOT/www/luci-static/resources/menu-opizwrt.js"

          # Dulu penjaga ini memakai ambang 70%, karena berkas yang dikirim
          # boleh saja lebih kecil dari sumber akibat pemadatan luci.mk.
          # Sekarang pemadatan itu mati (lihat Makefile) dan berkas di htdocs/
          # sudah padat sejak di-commit, jadi yang keluar dari buildroot harus
          # PERSIS sama. Perbandingan byte-per-byte menangkap pemotongan
          # sekecil apa pun, bukan cuma yang di bawah 70%.
          CSS_REPO=../src/htdocs/luci-static/opizwrt/cascade.css
          echo "  cascade.css: $(wc -c < "$CSS") byte (repo $(wc -c < "$CSS_REPO"))"
          if ! cmp -s "$CSS_REPO" "$CSS"; then
            echo "GAGAL: cascade.css terpasang berbeda dari yang ada di repo"
            cmp "$CSS_REPO" "$CSS" || true
            exit 1
          fi

          # Penanda dari ujung-ujung berkas: kalau yang terakhir ada, seluruh
          # isinya ada.
          for penanda in ":root" "side-brand" "tabbar" "navsheet" "prefers-reduced-motion" "@media print"; do
            if grep -q "$penanda" "$CSS"; then echo "  OK      css: $penanda"
            else echo "  HILANG  css: $penanda"; exit 1; fi
          done
          for penanda in "renderMainMenu" "renderBilahTab" "pasangPenandaSidebar" "renderTabMenu"; do
            if grep -q "$penanda" "$JS"; then echo "  OK      js: $penanda"
            else echo "  HILANG  js: $penanda"; exit 1; fi
          done

          mkdir -p ../out && cp "$PKG" ../out/
          # Salinan bernama tetap, supaya tautan
          # releases/latest/download/luci-theme-opizwrt.apk di README selalu
          # menunjuk berkas yang ada -- nama asli memuat nomor versi.
          cp "$PKG" "../out/luci-theme-opizwrt.${PKG##*.}"

      - uses: actions/upload-artifact@v4
        with:
          name: luci-theme-opizwrt
          path: out/*

      - name: Lampirkan ke rilis
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
